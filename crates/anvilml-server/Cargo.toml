[package]
name = "anvilml-server"
version = "0.1.26"
edition.workspace = true
rust-version.workspace = true

[dependencies]
anvilml-scheduler = { path = "../anvilml-scheduler" }
anvilml-worker = { path = "../anvilml-worker" }
anvilml-registry = { path = "../anvilml-registry" }
anvilml-artifacts = { path = "../anvilml-artifacts" }
anvilml-core = { path = "../anvilml-core" }
anvilml-ipc = { path = "../anvilml-ipc" }
anvilml-hardware = { path = "../anvilml-hardware" }
axum = { version = "0.8.9", features = ["ws"] }
rustc_version_runtime = "0.3.0"
sysinfo = "0.39.6"
tokio = { version = "1.47.0", features = ["sync", "rt", "time"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio", "migrate", "chrono"] }
tower-http = { version = "0.7", features = ["cors"] }
tracing = "0.1"
uuid = { version = "1.23", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1.47.0", features = ["full"] }
tower = "0.5"
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.23", features = ["v4"] }
tokio-tungstenite = "0.29.0"
futures-util = "0.3"
# anvilml-worker with test-utils: enables WorkerPool::set_up_test_workers()
# so stats_tick_tests.rs can inject mock handles with controllable status
# without spawning real worker subprocesses. Same pattern as
# crates/anvilml-scheduler/Cargo.toml's own dev-dependency override.
anvilml-worker = { path = "../anvilml-worker", features = ["test-utils"] }
# zeromq + bytes + rmp-serde: used by workers_tests.rs's restart tests
# (P18-D3) to spin up a real DEALER peer connected to a WorkerPool's
# RouterTransport and send a synthetic WorkerEvent::Ready, proving a
# restarted worker reaches Idle the same way a normal startup spawn does.
# Same versions/features as anvilml-worker's own dev-dependencies — see
# crates/anvilml-worker/tests/pool_tests.rs for the pattern this follows.
zeromq = { version = "0.6", default-features = false, features = ["tokio-runtime"] }
bytes = "1"
rmp-serde = "1"

[features]
mock-hardware = ["anvilml-hardware/mock-hardware"]
