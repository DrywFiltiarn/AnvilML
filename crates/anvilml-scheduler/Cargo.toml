[package]
name = "anvilml-scheduler"
version = "0.1.20"
edition.workspace = true
rust-version.workspace = true

[dependencies]
anvilml-worker = { path = "../anvilml-worker" }
anvilml-ipc = { path = "../anvilml-ipc" }
anvilml-registry = { path = "../anvilml-registry" }
anvilml-artifacts = { path = "../anvilml-artifacts" }
anvilml-core = { path = "../anvilml-core" }
anvilml-hardware = { path = "../anvilml-hardware" }
base64 = "0.22.1"
chrono = "0.4"
serde_json = "1"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt", "sync", "macros"] }
tracing = "0.1"
uuid = { version = "1.23.4", features = ["v4"] }

[dev-dependencies]
# Self-reference with test-util enabled: this is what makes ValidatedGraph's
# _test_new()/_test_inner() available to integration tests under tests/
# (a separate crate, per Cargo's compilation model) without those methods
# existing in any normal, release, or dependent-crate build. `cargo test`
# activates this; nothing else does.
anvilml-scheduler = { path = ".", features = ["test-util"] }
# anvilml-worker with test-utils: enables WorkerHandle and WorkerPool
# test-only methods (set_up_test_workers, spawn_all_with_spawner) so
# integration tests can inject mock handles with controllable status.
anvilml-worker = { path = "../anvilml-worker", features = ["test-utils"] }
# chrono is needed for Utc::now() when constructing Job values in tests.
chrono = "0.4"
# sqlx for creating in-memory SQLite pools with migrations in tests.
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio", "migrate", "chrono", "uuid"] }
# zeromq + bytes: used to spin up a real DEALER peer connected to a
# WorkerPool's RouterTransport, so dispatch_one() can be exercised on its
# genuine success path (DispatchOutcome::Dispatched) rather than only via
# the always-fails-with-no-real-peer path that set_up_test_workers() alone
# produces. Same versions/features as anvilml-ipc's own dev-dependencies —
# see crates/anvilml-ipc/tests/stress_test.rs for the pattern this follows.
zeromq = { version = "0.6.0", default-features = false, features = ["tokio-runtime", "all-transport"] }
bytes = "1.12"
# rmp_serde: decodes the msgpack payload the DEALER peer receives, to
# verify dispatch_one() actually sent a well-formed WorkerMessage::Execute
# addressed to the right job — not just that send() returned Ok.
rmp-serde = "1.3.1"

[features]
mock-hardware = ["anvilml-hardware/mock-hardware"]
# Gates ValidatedGraph::_test_new()/_test_inner() (types.rs) — test-only
# construction bypass, never enabled outside cargo test. See the
# [dev-dependencies] self-reference above and the P12-A1 gap note in
# docs/PHASES_GRAPH.md (gap #24).
test-util = []
