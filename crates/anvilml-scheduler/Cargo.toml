[package]
name = "anvilml-scheduler"
version = "0.1.8"
edition.workspace = true
rust-version.workspace = true

[dependencies]
anvilml-worker = { path = "../anvilml-worker" }
anvilml-registry = { path = "../anvilml-registry" }
anvilml-artifacts = { path = "../anvilml-artifacts" }
anvilml-core = { path = "../anvilml-core" }
anvilml-hardware = { path = "../anvilml-hardware" }
serde_json = "1"
thiserror = "2.0.18"
uuid = { version = "1.23.4", features = ["v4"] }

[dev-dependencies]
# Self-reference with test-util enabled: this is what makes ValidatedGraph's
# _test_new()/_test_inner() available to integration tests under tests/
# (a separate crate, per Cargo's compilation model) without those methods
# existing in any normal, release, or dependent-crate build. `cargo test`
# activates this; nothing else does.
anvilml-scheduler = { path = ".", features = ["test-util"] }
# chrono is needed for Utc::now() when constructing Job values in tests.
chrono = "0.4"

[features]
mock-hardware = ["anvilml-hardware/mock-hardware"]
# Gates ValidatedGraph::_test_new()/_test_inner() (types.rs) — test-only
# construction bypass, never enabled outside cargo test. See the
# [dev-dependencies] self-reference above and the P12-A1 gap note in
# docs/PHASES_GRAPH.md (gap #24).
test-util = []
