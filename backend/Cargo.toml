[package]
name = "anvilml"
version = "0.1.17"
edition.workspace = true
rust-version.workspace = true

[features]
# Forwards to anvilml-scheduler (→ anvilml-hardware/mock-hardware) AND
# anvilml-worker/mock-hardware. Both are needed: anvilml-worker declares
# its own separate `mock-hardware` Cargo feature (not the same flag as
# anvilml-hardware's, despite the shared name — Cargo features are
# per-package) and gates its own real-vs-mock worker spawn decision on it
# in `pool.rs`. Before this fix, `cargo build --features mock-hardware`
# at this crate never reached that flag, so workers always attempted
# real-hardware startup regardless of this feature — masked in practice
# only by the pre-existing `ANVILML_FORCE_WORKER_MOCK` runtime escape
# hatch. Found and worked around (not fixed) during `P14-E1`; fixed here.
# See docs/PHASES_GRAPH.md's Known Wiring Gaps Closed table.
mock-hardware = ["anvilml-scheduler/mock-hardware", "anvilml-worker/mock-hardware"]

[dependencies]
anvilml-artifacts = { path = "../crates/anvilml-artifacts" }
anvilml-core = { path = "../crates/anvilml-core" }
anvilml-hardware = { path = "../crates/anvilml-hardware" }
anvilml-ipc = { path = "../crates/anvilml-ipc" }
anvilml-registry = { path = "../crates/anvilml-registry" }
anvilml-scheduler = { path = "../crates/anvilml-scheduler" }
anvilml-server = { path = "../crates/anvilml-server" }
anvilml-worker = { path = "../crates/anvilml-worker" }
axum = "0.8.9"
clap = { version = "4.6.1", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# INTERIM-P14-PATCH (manual retrofit, pre-Phase-16): needed for the interim
# job-completion channel's type annotation in main.rs. See
# crates/anvilml-scheduler/src/interim_job_completion.rs.
uuid = { version = "1.23.4", features = ["serde"] }

[dev-dependencies]
serial_test = "3.5.0"
tempfile = "3.26"
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio", "migrate", "chrono"] }
reqwest = { version = "0.12", features = ["blocking"] }
