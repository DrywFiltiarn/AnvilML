name: AnvilML-CI

on: [push, pull_request]

jobs:
  rust-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache pip downloads (worker deps)
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ~/AppData/Local/pip/Cache
          key: ${{ runner.os }}-pip-worker-${{ hashFiles('worker/requirements/base.txt', 'worker/requirements/cpu-runner-reqs.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-worker-

      - name: Provision worker venv (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: bash scripts/install_worker_deps.sh --mode=ci

      - name: Provision worker venv (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: .\scripts\install_worker_deps.ps1 --mode=ci

      - name: Check formatting (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: Clippy check
        run: cargo clippy --workspace --features mock-hardware -- -D warnings

      - name: Run tests
        run: cargo test --workspace --features mock-hardware

  worker-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            mode: mock
          - os: ubuntu-latest
            mode: real
          - os: windows-latest
            mode: mock
          - os: windows-latest
            mode: real
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # --- Mock-mode steps (ubuntu + windows) ---
      - name: Set up Python
        if: matrix.mode == 'mock'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: worker/requirements/base.txt

      - name: Provision worker venv (mock mode, Linux)
        if: matrix.mode == 'mock' && matrix.os == 'ubuntu-latest'
        run: |
          python -m venv worker/.venv
          worker/.venv/bin/pip install --upgrade pip
          worker/.venv/bin/pip install -r worker/requirements/base.txt
          echo "$GITHUB_WORKSPACE/worker/.venv/bin" >> "$GITHUB_PATH"

      - name: Provision worker venv (mock mode, Windows)
        if: matrix.mode == 'mock' && matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          python -m venv worker/.venv
          worker/.venv/Scripts/pip.exe install --upgrade pip
          worker/.venv/Scripts/pip.exe install -r worker/requirements/base.txt
          Add-Content -Path $env:GITHUB_PATH -Value "$pwd\worker\.venv\Scripts"

      - name: Run mock-mode tests
        if: matrix.mode == 'mock'
        env:
          ANVILML_WORKER_MOCK: "1"
        run: python -m pytest worker/tests -v -m "not real_mode"

      # --- Real-mode steps (ubuntu + windows) ---
      - name: Set up Python
        if: matrix.mode == 'real'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            worker/requirements/base.txt
            worker/requirements/cpu-runner-reqs.txt

      - name: Install base dependencies
        if: matrix.mode == 'real'
        run: pip install -r worker/requirements/base.txt

      - name: Check mock suite collection (no torch)
        if: matrix.mode == 'real'
        run: python -m pytest worker/tests --collect-only -m "not real_mode"

      - name: Provision worker venv (real mode, Linux)
        if: matrix.mode == 'real' && matrix.os == 'ubuntu-latest'
        run: |
          python -m venv worker/.venv
          worker/.venv/bin/pip install --upgrade pip
          worker/.venv/bin/pip install -r worker/requirements/base.txt
          worker/.venv/bin/pip install -r worker/requirements/cpu-runner-reqs.txt
          echo "$GITHUB_WORKSPACE/worker/.venv/bin" >> "$GITHUB_PATH"

      - name: Provision worker venv (real mode, Windows)
        if: matrix.mode == 'real' && matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          python -m venv worker/.venv
          worker/.venv/Scripts/pip.exe install --upgrade pip
          worker/.venv/Scripts/pip.exe install -r worker/requirements/base.txt
          worker/.venv/Scripts/pip.exe install -r worker/requirements/cpu-runner-reqs.txt
          Add-Content -Path $env:GITHUB_PATH -Value "$pwd\worker\.venv\Scripts"

      - name: Run real-mode tests
        if: matrix.mode == 'real'
        run: python -m pytest worker/tests -v -m real_mode

  openapi-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Generate OpenAPI spec
        run: cargo run -p anvilml-openapi

      - name: Check for drift
        run: git diff --exit-code api/openapi.json

  config-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Check config drift
        run: echo "no openapi/config yet"